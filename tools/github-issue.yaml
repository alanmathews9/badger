name: github_issue
description: >
  Read one issue or pull request in full, including its entire comment thread.
  Use this after github_search surfaces something relevant. The comments matter:
  a decision's official version tends to live in the body or a file, while what
  the team actually concluded lives in the discussion underneath.
input_schema:
  type: object
  properties:
    number:
      type: integer
      description: The issue or pull request number, as shown by github_search.
    max_comments:
      type: integer
      description: Maximum comments to include, 1-50. Default 20.
  required: [number]
implementation:
  script: scripts/issue.mjs
  runtime: node

# Read-only, in the standard's own vocabulary. Runtime 2.1.0 does not read
# annotations (dist/tool-loader.js never mentions the block) — enforcement is
# hooks/allowed-tools.txt, the eight-action Composio enable list and the
# DIRECT_TOOLS preset. This is the declaration, not the enforcement, and for
# an agent whose whole claim is read-only it is worth making in the format the
# spec defines for it.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
