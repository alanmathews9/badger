name: gmail_search
description: >
  Search the connected mailbox by text. Mail is where you find what was
  actually said to whom, and when — the version of events that never made it
  into a document. Use this for questions about what a client was told, what
  was promised, who raised something first, or what people said among
  themselves. Returns messages with sender, date, thread id and a body
  excerpt.
input_schema:
  type: object
  properties:
    query:
      type: string
      description: >
        What to look for. Ask in plain words — the query is reduced to keywords
        and OR'd for you, because Gmail requires every bare word to match and a
        whole question would find nothing. Gmail qualifiers are honoured and
        still narrow the results: "from:name", "subject:x", "label:inbox". A
        "quoted phrase" is searched exactly as written instead of being reduced.
    from:
      type: string
      description: Restrict to mail from a person or domain, e.g. "joris" or "brightsmile.example".
    since_days:
      type: integer
      description: >
        Restrict to the last N days. The date is computed for you — always use
        this instead of writing an after:/before: qualifier yourself, because
        you do not reliably know today's date.
    limit:
      type: integer
      description: Maximum messages, 1-25. Default 10.
  required: [query]
implementation:
  script: scripts/gmail-search.mjs
  runtime: node
