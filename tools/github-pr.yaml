name: github_pr
description: >
  Read one pull request in full: state, description, the files it changes, its
  inline review comments (anchored to file and line), and its conversation.
  Use this for anything about a PR — review feedback, what changed, whether it
  merged. github_issue cannot see inline review comments, which is where the
  actionable feedback lives.
input_schema:
  type: object
  properties:
    number:
      type: integer
      description: The pull request number.
    max_comments:
      type: integer
      description: Maximum comments per stream, 1-60. Default 30.
  required: [number]
implementation:
  script: scripts/pr.mjs
  runtime: node

# Read-only, in the standard's own vocabulary. Runtime 2.1.0 does not read
# annotations (dist/tool-loader.js never mentions the block) — enforcement is
# hooks/allowed-tools.txt, the eight-action Composio enable list and the
# DIRECT_TOOLS preset. This is the declaration, not the enforcement, and for
# an agent whose whole claim is read-only it is worth making in the format the
# spec defines for it.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
