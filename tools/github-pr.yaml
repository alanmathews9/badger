name: github_pr
description: >
  Read one pull request in full: state, description, the files it changes, its
  inline review comments (anchored to file and line), and its conversation.
  Use this for anything about a PR — review feedback, what changed, whether it
  merged. github_issue cannot see inline review comments, which is where the
  actionable feedback lives.
input_schema:
  type: object
  properties:
    number:
      type: integer
      description: The pull request number.
    max_comments:
      type: integer
      description: Maximum comments per stream, 1-60. Default 30.
  required: [number]
implementation:
  script: scripts/pr.mjs
  runtime: node
