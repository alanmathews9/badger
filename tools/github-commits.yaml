name: github_commits
description: >
  List recent commits, optionally narrowed to one file path or author. Answers
  when something changed and who has been touching it — which is how ownership
  questions get answered here, since file contents are not searchable.
input_schema:
  type: object
  properties:
    path:
      type: string
      description: Only commits modifying this file path.
    author:
      type: string
      description: Filter by the author's GitHub login or email.
    since:
      type: string
      description: ISO 8601 timestamp; only commits at or after it.
    limit:
      type: integer
      description: Maximum commits, 1-50. Default 15.
implementation:
  script: scripts/commits.mjs
  runtime: node

# Read-only, in the standard's own vocabulary. Runtime 2.1.0 does not read
# annotations (dist/tool-loader.js never mentions the block) — enforcement is
# hooks/allowed-tools.txt, the eight-action Composio enable list and the
# DIRECT_TOOLS preset. This is the declaration, not the enforcement, and for
# an agent whose whole claim is read-only it is worth making in the format the
# spec defines for it.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
