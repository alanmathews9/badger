name: github_file
description: >
  Read a file, or list a directory, at a known path in the repository. File
  contents cannot be searched on a private repository, so discover paths by
  listing directories — pass "" for the repository root — then read the file.
input_schema:
  type: object
  properties:
    path:
      type: string
      description: Path to a file or directory. Use "" for the repository root.
    ref:
      type: string
      description: Optional branch, tag or commit SHA. Defaults to the default branch.
  required: [path]
implementation:
  script: scripts/file.mjs
  runtime: node

# Read-only, in the standard's own vocabulary. Runtime 2.1.0 does not read
# annotations (dist/tool-loader.js never mentions the block) — enforcement is
# hooks/allowed-tools.txt, the eight-action Composio enable list and the
# DIRECT_TOOLS preset. This is the declaration, not the enforcement, and for
# an agent whose whole claim is read-only it is worth making in the format the
# spec defines for it.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
