name: gmail_thread
description: >
  Read a whole mail thread, oldest message first. A single message is rarely
  the answer — the ask, the pushback and the decision are usually several
  messages apart in the same exchange. Call this with a thread id from
  gmail_search whenever a result looks relevant.
input_schema:
  type: object
  properties:
    thread_id:
      type: string
      description: Thread id, taken from a gmail_search result.
    full:
      type: boolean
      description: >
        Return complete message bodies instead of clipping each one. Default
        false. Use it when a clipped message looks like it continues into the
        part you need.
  required: [thread_id]
implementation:
  script: scripts/gmail-thread.mjs
  runtime: node

# Read-only, in the standard's own vocabulary. Runtime 2.1.0 does not read
# annotations (dist/tool-loader.js never mentions the block) — enforcement is
# hooks/allowed-tools.txt, the eight-action Composio enable list and the
# DIRECT_TOOLS preset. This is the declaration, not the enforcement, and for
# an agent whose whole claim is read-only it is worth making in the format the
# spec defines for it.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
