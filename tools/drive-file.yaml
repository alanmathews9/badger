name: drive_file
description: >
  Read one Google Doc or Sheet in full, by id. Sheets come back as CSV, with
  the first line as the header row. Use this after drive_search to read a
  document properly rather than answering from its excerpt.
input_schema:
  type: object
  properties:
    file_id:
      type: string
      description: File id, taken from a drive_search result.
    max_chars:
      type: integer
      description: Maximum characters to return, 500-20000. Default 8000.
  required: [file_id]
implementation:
  script: scripts/drive-file.mjs
  runtime: node

# Read-only, in the standard's own vocabulary. Runtime 2.1.0 does not read
# annotations (dist/tool-loader.js never mentions the block) — enforcement is
# hooks/allowed-tools.txt, the eight-action Composio enable list and the
# DIRECT_TOOLS preset. This is the declaration, not the enforcement, and for
# an agent whose whole claim is read-only it is worth making in the format the
# spec defines for it.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
