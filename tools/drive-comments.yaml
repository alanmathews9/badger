name: drive_comments
description: >
  Read the comments on a Drive document. This is where disagreement with the
  document lives — a customer-facing document may say one thing while the comment
  underneath it says another. Whenever a document answers a contested question,
  check its comments before concluding, and say so if they disagree.
input_schema:
  type: object
  properties:
    file_id:
      type: string
      description: File id, taken from a drive_search result.
  required: [file_id]
implementation:
  script: scripts/drive-comments.mjs
  runtime: node

# Read-only, in the standard's own vocabulary. Runtime 2.1.0 does not read
# annotations (dist/tool-loader.js never mentions the block) — enforcement is
# hooks/allowed-tools.txt, the eight-action Composio enable list and the
# DIRECT_TOOLS preset. This is the declaration, not the enforcement, and for
# an agent whose whole claim is read-only it is worth making in the format the
# spec defines for it.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
