name: drive_comments
description: >
  Read the comments on a Drive document. This is where disagreement with the
  document lives — a customer-facing document may say one thing while the comment
  underneath it says another. Whenever a document answers a contested question,
  check its comments before concluding, and say so if they disagree.
input_schema:
  type: object
  properties:
    file_id:
      type: string
      description: File id, taken from a drive_search result.
  required: [file_id]
implementation:
  # Both spellings: the runtime reads `script`, the schema requires
  # `type` + `path`. See docs/UPSTREAM.md finding 2.
  type: script
  path: scripts/drive-comments.mjs
  script: scripts/drive-comments.mjs
  runtime: node

# Declaration, not enforcement: runtime 2.1.0 does not read annotations.
# Enforcement is hooks/allowed-tools.txt, the Composio enable list and the
# DIRECT_TOOLS preset.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
