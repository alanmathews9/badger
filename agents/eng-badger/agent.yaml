spec_version: "0.1.0"
name: eng-badger
version: 0.1.0
description: >
  Code, issues, releases and decisions, answered from GitHub. Holds no mail or
  document tools, so a question routed here is answered from the argument as it
  was had in the open, never from the client-facing summary of it.
author: alan-mathews
license: MIT

model:
  preferred: "google-vertex:gemini-2.5-flash"
  constraints:
    temperature: 0.1
    max_tokens: 8192

runtime:
  max_turns: 18
  timeout: 300

# The runtime treats this list as a FILTER over this folder's own skills/
# (dist/loader.js:194), and it cannot reach the parent's. So the skills are
# copied in beside this file and named here.
skills:
  - trace-decision
  - recent-activity

# No `added_via` marker: this agent is seeded and hand-written. Its absence is
# what the UI reads as "built in", the same rule skills follow.
#
# The tool list is NOT here. `metadata` values must be a string, a number or a
# boolean (agent-yaml.schema.json), so tools/*.yaml is the truth and the store
# derives the list by reading each file's `name:`.
metadata:
  created_at: "2026-08-21T00:00:00Z"
  output_format: text
  memory: true

tags:
  - workplace-search
  - engineering
  - decisions
  - github
