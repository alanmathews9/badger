name: github_commits
description: >
  List recent commits, optionally narrowed to one file path or author. Answers
  when something changed and who has been touching it — which is how ownership
  questions get answered here, since file contents are not searchable.
input_schema:
  type: object
  properties:
    path:
      type: string
      description: Only commits modifying this file path.
    author:
      type: string
      description: Filter by the author's GitHub login or email.
    since:
      type: string
      description: ISO 8601 timestamp; only commits at or after it.
    limit:
      type: integer
      description: Maximum commits, 1-50. Default 15.
implementation:
  # Copied from the root tools/, with the path pointing back at the one
  # shared implementation: the runtime resolves join(agentDir, "tools",
  # script), so three `..` segments reach the repo root.
  # Both spellings: the runtime reads `script`, the schema requires
  # `type` + `path`. See docs/UPSTREAM.md finding 2.
  type: script
  path: ../../../tools/scripts/commits.mjs
  script: ../../../tools/scripts/commits.mjs
  runtime: node

# Declaration, not enforcement: runtime 2.1.0 does not read annotations.
# Enforcement is hooks/allowed-tools.txt, the Composio enable list and the
# DIRECT_TOOLS preset.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
