name: github_file
description: >
  Read a file, or list a directory, at a known path in the repository. File
  contents cannot be searched on a private repository, so discover paths by
  listing directories — pass "" for the repository root — then read the file.
input_schema:
  type: object
  properties:
    path:
      type: string
      description: Path to a file or directory. Use "" for the repository root.
    ref:
      type: string
      description: Optional branch, tag or commit SHA. Defaults to the default branch.
  required: [path]
implementation:
  # Both spellings: the runtime reads `script`, the schema requires
  # `type` + `path`. See docs/UPSTREAM.md finding 2.
  type: script
  path: ../../../tools/scripts/file.mjs
  script: ../../../tools/scripts/file.mjs
  runtime: node

# Declaration, not enforcement: runtime 2.1.0 does not read annotations.
# Enforcement is hooks/allowed-tools.txt, the Composio enable list and the
# DIRECT_TOOLS preset.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
