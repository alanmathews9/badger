name: drive_file
description: >
  Read one Google Doc or Sheet in full, by id. Sheets come back as CSV, with
  the first line as the header row. Use this after drive_search to read a
  document properly rather than answering from its excerpt.
input_schema:
  type: object
  properties:
    file_id:
      type: string
      description: File id, taken from a drive_search result.
    max_chars:
      type: integer
      description: Maximum characters to return, 500-20000. Default 8000.
  required: [file_id]
implementation:
  # Both spellings: the runtime reads `script`, the schema requires
  # `type` + `path`. See docs/UPSTREAM.md finding 2.
  type: script
  path: ../../../tools/scripts/drive-file.mjs
  script: ../../../tools/scripts/drive-file.mjs
  runtime: node

# Declaration, not enforcement: runtime 2.1.0 does not read annotations.
# Enforcement is hooks/allowed-tools.txt, the Composio enable list and the
# DIRECT_TOOLS preset.
annotations:
  read_only: true
  idempotent: true
  requires_confirmation: false
