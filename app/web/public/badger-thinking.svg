<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Badger thinking">
  <title>Badger thinking</title>
  <defs>
    <clipPath id="bhead"><path d="M32.2 -16.2 L28.5 -18.6 L24 -22 L18.5 -23.4 L17 -16.5 L19 -14.6 L26.5 -13.4 L32.6 -13.2 Z"/></clipPath>
  </defs>
  <!-- the ring it walks round the inside of -->
  <circle cx="60" cy="60" r="51" fill="none" stroke="#1B1917" stroke-width="2.2" opacity=".13"/>

  <g>
    <!-- one lap every 1.05s, anticlockwise, because the badger faces right -->
    <animateTransform attributeName="transform" type="rotate" values="360 60 60; 0 60 60" dur="1.05s" repeatCount="indefinite"/>

    <!-- the ground already covered, trailing behind it -->
    <circle cx="60" cy="60" r="51" fill="none" stroke="#1B1917" stroke-width="2.2" opacity=".4"
            stroke-linecap="round" stroke-dasharray="54 266" stroke-dashoffset="-80"/>

    <g transform="translate(58,93.3) scale(1.5)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1; 0 0" dur=".2s" repeatCount="indefinite" additive="sum"/>
    <g fill="#1B1917">
          <g transform="translate(-13,-11.5)">
            <animateTransform attributeName="transform" type="rotate" values="16;-18;16" dur=".2s" repeatCount="indefinite" additive="sum"/>
            <path d="M-4.2 -1.5 L4.2 -1.5 L3.4 8.8 L5.4 11.8 L-2.2 11.8 L-3.6 8.8 Z" opacity=".7"/>
          </g>
          <g transform="translate(10,-11.5)">
            <animateTransform attributeName="transform" type="rotate" values="-18;16;-18" dur=".2s" repeatCount="indefinite" additive="sum"/>
            <path d="M-4.2 -1.5 L4.2 -1.5 L3.4 8.8 L5.4 11.8 L-2.2 11.8 L-3.6 8.8 Z" opacity=".7"/>
          </g>
          <path d="M-18 -25.4 L-27.5 -27 L-19.5 -19.4 Z"/>
          <path d="M32.2 -16.2 L28.5 -18.6 L24 -22 L18.5 -23.4 L12 -25.8 L-10 -27.8 L-18 -25.2 L-21 -18.5 L-16 -10.8 L8 -11.4 L14 -13.4 L19 -14.8 L26.5 -13.4 L32.6 -13.2 Z"/>
          <path d="M20.6 -23 L19 -26.9 L16.2 -23.6 Z"/>
        </g>
        <g clip-path="url(#bhead)" fill="#F5F5F4">
          <rect x="18.4" y="-19.6" width="13.2" height="2.2" rx="1.1" transform="rotate(31 25 -18.5)"/>
        </g>
        <g fill="#1B1917">
          <g transform="translate(-8.5,-11.5)">
            <animateTransform attributeName="transform" type="rotate" values="-18;16;-18" dur=".2s" repeatCount="indefinite" additive="sum"/>
            <path d="M-4.2 -1.5 L4.2 -1.5 L3.4 8.8 L5.4 11.8 L-2.2 11.8 L-3.6 8.8 Z"/>
          </g>
          <g transform="translate(13.5,-11.5)">
            <animateTransform attributeName="transform" type="rotate" values="16;-18;16" dur=".2s" repeatCount="indefinite" additive="sum"/>
            <path d="M-4.2 -1.5 L4.2 -1.5 L3.4 8.8 L5.4 11.8 L-2.2 11.8 L-3.6 8.8 Z"/>
          </g>
        </g>
    </g>
  </g>
</svg>
