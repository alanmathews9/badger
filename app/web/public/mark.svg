  <title>Badger</title>
  <style>
    /* The mark alone, ink on nothing — no tile behind it. `logo.svg` is the
       same drawing with the wordmark beside it, which is redundant anywhere
       the name is already set in type. */
    svg:root { color: #1C1917 }
  </style>
  <defs>
