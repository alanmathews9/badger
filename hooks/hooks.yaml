# Lifecycle hooks. Scripts resolve relative to this hooks/ directory and are
# run with `sh`, receiving the event as JSON on stdin and replying with JSON
# on stdout: {"action":"allow"} | {"action":"block","reason":"..."}.
#
# One hook, and it is a pre-flight rather than a constraint: the runtime is
# fail-soft about sources (a server with no credential is skipped silently and
# the model is never told), so without this check Badger could answer
# "nothing found" for a source it never contacted. The pre_tool_use allowlist
# that used to live here was removed 2026-08-19 — the agent's tool surface is
# open, per the decision to run the framework unconstrained.

hooks:
  on_session_start:
    - script: check-sources.sh
      description: >-
        Refuse to start if a source declared in agent.yaml has no credential.
        The runtime skips unreachable servers silently, so without this Badger
        can report "nothing found" for a source it never contacted.
