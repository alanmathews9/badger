# Lifecycle hooks. Scripts resolve relative to this hooks/ directory and are
# run with `sh`, receiving the event as JSON on stdin and replying with JSON
# on stdout: {"action":"allow"} | {"action":"block","reason":"..."} |
# {"action":"modify","args":{...}}.
#
# pre_tool_use wraps EVERY tool — builtin, declarative, plugin and MCP alike —
# and is the only place in gitagent 2.1.0 where a tool call can actually be
# refused. agent.yaml's `tools:` list is ignored by the runtime and MCP servers
# register every tool they expose, so this file is Badger's real read-only
# boundary. RULES.md states the policy; this enforces it.

hooks:
  pre_tool_use:
    - script: allow-read-only.sh
      description: >-
        Allow only the exact tool names in allowed-tools.txt. Everything else
        is blocked, including tools that do not exist yet.
