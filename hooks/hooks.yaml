# Lifecycle hooks. Scripts resolve relative to this hooks/ directory and are
# run with `sh`, receiving the event as JSON on stdin and replying with JSON
# on stdout: {"action":"allow"} | {"action":"block","reason":"..."}.
#
# Two hooks. allow-tools gates tool calls against allowed-tools.txt — a
# short, simple list of everything the agent may call, runtime builtins and
# learning loop included; anything unlisted fails closed. check-sources is a
# pre-flight: the runtime is fail-soft about sources (a server with no
# credential is skipped silently and the model is never told), so without it
# Badger could answer "nothing found" for a source it never contacted.

hooks:
  pre_tool_use:
    - script: allow-tools.sh
      description: >-
        Allow the tool names in allowed-tools.txt — the full runtime surface,
        builtins and learning loop included — and block anything unlisted.

  on_session_start:
    - script: check-sources.sh
      description: >-
        Refuse to start if a source declared in agent.yaml has no credential.
        The runtime skips unreachable servers silently, so without this Badger
        can report "nothing found" for a source it never contacted.
