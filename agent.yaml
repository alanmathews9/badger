  #   args: ["-y", "<gmail-mcp-package>"]
  #   env:
  #     GOOGLE_OAUTH_CREDENTIALS: "${GOOGLE_OAUTH_CREDENTIALS}"
  #   timeoutMs: 30000
  #
  # drive:
  #   command: npx
  #   args: ["-y", "<gdrive-mcp-package>"]
  #   env:
  #     GOOGLE_OAUTH_CREDENTIALS: "${GOOGLE_OAUTH_CREDENTIALS}"
