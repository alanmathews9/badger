spec_version: "0.1.0"
name: badger
version: 0.1.0
description: >
  Workplace search across GitHub, Gmail and Google Drive. Answers questions
  about your work by searching all three, opening what looks relevant, and
  citing every source it used. Searches a local index first and the live APIs
  second, so an answer is fast and a missing document is still found.
  Read-only: Badger searches, reads and reports, and never sends, edits or
  changes anything.
author: alan-mathews
license: MIT

model:
  preferred: "google-vertex:gemini-2.5-flash"
  fallback:
    - "google-vertex:gemini-2.5-flash-lite"
  constraints:
    temperature: 0.1
    max_tokens: 8192

# No tools: block — the runtime ignores the key (it reads tools/*.yaml and
# builtins directly). And deliberately NO skills: list — the loader treats
# that list as a filter (dist/loader.js:194), so naming skills here would
# silently drop anything the agent learns or a person adds through the UI.
# The skills/ directory is the whole truth.

runtime:
  # timeout is read (dist/index.js:476, dist/sdk.js:139). max_turns is a spec
  # key that runtime 2.1.0 does not read — the only bound that applies is the
  # caller's, and app/server/server.mjs passes 12. Kept because it is the
  # standard's way to declare the intent, and stated here so the two numbers
  # are not read as a disagreement.
  max_turns: 40
  timeout: 300

# Sub-agents, in the spec's directory form (§13): each name here must exist as
# agents/<name>/ with its own agent.yaml, and `opengap validate` fails the
# build when one does not (dist/commands/validate.js:60). The store keeps this
# block in step on create and delete.
#
# This is a MANIFEST, not the delegation mechanism. Runtime 2.1.0 implements
# delegation as a shell-out — formatSubAgentsForPrompt (agents.js:80) tells the
# model to run `gitagent --dir ...` through `cli`, which Badger does not hold
# and never will. Routing happens the other way instead: the server is told
# which agent a question is for and calls query({ dir: "agents/<slug>" })
# directly, so no shell is involved and the read-only layers are unchanged.
# See docs/UPSTREAM.md finding 5.
agents:
  eng-badger:
    description: >-
      Code, issues, releases and decisions, from GitHub. Holds no mail or
      document tools.
  hr-badger:
    description: "Answer a question about how this organisation works from the written policy and the mail that qualifies it, and say plainly when the two disagree."
  support-badger:
    description: "Answer what a customer was told, what the policy says, and whether those two are the same thing."
  release-comms-agent:
    description: "Say what actually shipped, who outside engineering was told, and where those two diverge"

# Written in the vocabulary of the OpenGAP spec, not the reference runtime's.
# Those disagree: dist/compliance.js (gitagent 2.1.0) reads `risk_level`,
# `data_classification` and `human_in_the_loop` at the top of this block, while
# spec/schemas/agent-yaml.schema.json defines `risk_tier`,
# `data_governance.data_classification` and `supervision.human_in_the_loop`.
# This file used to carry the runtime's spelling on the grounds that it is the
# one that executes. That was checked and it is wrong: those three keys are
# read only by validateCompliance(), whose output is printed as a warning on
# the CLI path and never read at all on the SDK path this product uses
# (sdk.js loads the manifest and ignores complianceWarnings). The one key with
# behaviour behind it — recordkeeping.audit_logging, which switches on
# AuditLogger — is spelled identically in both. So the spec's spelling costs
# nothing and `opengap validate` passes on this file.
#
# No `frameworks:` list. FINRA, SR 11-7 and Reg S-P do not apply to a
# workplace-search demo, and naming one to score better on `opengap audit`
# would be the same confidently-wrong indicator this repo has been burned by
# before. An empty list is the honest answer.
compliance:
  risk_tier: standard

  supervision:
    # Badger answers without asking a human first, so this is `none` rather
    # than `advisory`. What a human does have is a daily answer ceiling that
    # ends the service rather than degrading it, and a per-run turn bound.
    #
    # Deliberately NOT claimed here: the composer's stop control. It stops the
    # answer reaching the reader and frees the concurrency slot, but it does
    # not stop the run — gitagent 2.1.0's `query().abort()` signals an
    # AbortController whose signal is passed to nothing (sdk.js:63,537; see
    # docs/UPSTREAM.md finding 4). A kill switch that does not kill is worse
    # than none, so the ceiling is what this field rests on.
    human_in_the_loop: none
    # Both true and both named: Alan reviews the agent, and the cadence is the
    # one compliance/validation-schedule.yaml actually runs on — the eval suite
    # and `opengap validate` weekly, not an aspiration.
    designated_supervisor: alan-mathews
    review_cadence: weekly
    override_capability: true
    # The daily answer ceiling and the per-run turn bound, both enforced
    # server-side, plus taking the service down. Not the stop button — see
    # above.
    kill_switch: true

  recordkeeping:
    # True, and made true rather than declared. The runtime only wires its
    # AuditLogger into the CLI entry point, so every SDK run — this server,
    # badger-sdk.mjs, eval.mjs — left no trace while this manifest claimed
    # one; app/server/audit.mjs closes that, writing the same JSONL shape to
    # the same .gitagent/audit.jsonl so CLI and SDK runs interleave.
    #
    # `log_contents` lists two of the five categories the spec offers, and
    # that is the measurement rather than the ambition. audit.mjs records
    # tool_use with its arguments, tool_result truncated to 1000 characters,
    # and a bare `response` event carrying no text — so tool calls and
    # timestamps are logged, prompts_and_responses and model_version are not.
    # Claiming the other three would be the confidently-wrong indicator this
    # repo has been caught by before; the fix is to log them or not to say so.
    #
    # `immutable: false` is the other honest half. The file is append-only,
    # not write-once, so it does not meet SEC 17a-4 and does not claim to.
    # `retention_period: 30d` is real only in production, where each entry
    # also goes to stdout and Cloud Logging's default 30-day retention is what
    # keeps it — the container's own copy dies with the instance.
    audit_logging: true
    log_format: structured_json
    retention_period: 30d
    log_contents:
      - tool_calls
      - timestamps
    immutable: false

  data_governance:
    # `allow`, not `redact`. Badger's whole job is to show a person the mail
    # and documents they already have access to; redacting the names in them
    # would break the product. The control is that it never sees more than the
    # connected account sees.
    pii_handling: allow
    data_classification: confidential
    consent_required: false
    cross_border: true
    bias_testing: false
    lda_search: false

  # The read-only guarantee, stated in the standard's own vocabulary instead of
  # only in prose. Four roles exist; Badger holds exactly one. Writing to a
  # source is declared as a handoff requiring three roles that no agent in this
  # system is assigned, so there is no assignment of roles under which a write
  # is reachable. `opengap validate --compliance` checks this: it fails the
  # build if any agent is ever given two roles that conflict.
  segregation_of_duties:
    roles:
      - id: reader
        description: Searches and reads connected sources, and reports findings with citations
        permissions: [report]
      - id: writer
        description: Creates or modifies content in a connected source
        permissions: [create, submit]
      - id: approver
        description: Reviews a proposed write and approves or rejects it
        permissions: [review, approve, reject]
      - id: executor
        description: Performs an approved write against the source
        permissions: [execute]
    conflicts:
      - [reader, writer]
      - [reader, executor]
      - [writer, approver]
      - [writer, executor]
    assignments:
      # Every sub-agent under agents/ holds the same single role. A sub-agent
      # is a narrower Badger, never a more capable one: it can only ever hold
      # a subset of the tools, so `reader` is the ceiling and adding one here
      # cannot widen what the system can do. Each agent's own DUTIES.md states
      # the same thing where the runtime reads it into the prompt.
      #
      # `badger` warns here — "[SOD] Agent badger in assignments not found in
      # agents section" — and that is upstream, not a defect to fix. Once an
      # `agents:` block exists, validate.js:256 requires every assigned name to
      # appear in it, with no exemption for the root agent's own name. Adding
      # `badger:` there would demand an agents/badger/ directory and turn the
      # warning into an error. Do NOT silence it by dropping this line: it is
      # the assignment the whole read-only story rests on.
      badger: [reader]
      hr-badger: [reader]
      eng-badger: [reader]
    isolation:
      # Trivially satisfied while one agent holds one role, and stated anyway
      # because it is the constraint any future writer role would have to meet:
      # a write credential would be a second credential, never this one.
      state: full
      credentials: separate
    handoffs:
      - action: source_write
        required_roles: [writer, approver, executor]
        approval_required: true
    enforcement: strict

tags:
  - workplace-search
  - federated-search
  - enterprise-search
  - github
  - citations
