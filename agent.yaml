spec_version: "0.1.0"
name: badger
version: 0.1.0
description: >
  Federated workplace search. Answers questions about your work by querying
  connected sources live at ask-time and citing every source. No crawler, no
  index, no copy of your data. Read-only: Badger searches, reads and reports,
  and never sends, edits or changes anything.
author: alan-mathews
license: MIT

model:
  preferred: "google-vertex:gemini-2.5-flash"
  fallback:
    - "google-vertex:gemini-2.5-flash-lite"
  constraints:
    temperature: 0.1
    max_tokens: 8192

# Kept in step with hooks/allowed-tools.txt, which is what actually enforces
# this. The runtime ignores this key, but it is the first thing a reader opens.
tools:
  - read
  - memory
  - github_search
  - github_issue
  - github_pr
  - github_file
  - github_commits
  - gmail_search
  - gmail_thread
  - drive_search
  - drive_file
  - drive_comments

skills:
  - trace-decision
  - find-expert
  - onboard-to-project
  - triage-pr-feedback
  - activity-digest

runtime:
  max_turns: 40
  timeout: 300

compliance:
  risk_level: medium
  data_classification: confidential
  human_in_the_loop: false
  recordkeeping:
    audit_logging: true
    retention_days: 30

tags:
  - workplace-search
  - federated-search
  - enterprise-search
  - github
  - citations
