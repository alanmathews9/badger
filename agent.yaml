spec_version: "0.1.0"
name: badger
version: 0.1.0
description: >
  Federated workplace search. Answers questions about your work by querying
  connected sources live at ask-time and citing every source. No crawler, no
  index, no copy of your data. Read-only: Badger searches, reads and reports,
  and never sends, edits or changes anything.
author: alan-mathews
license: MIT

model:
  preferred: "google-vertex:gemini-2.5-flash"
  fallback:
    - "google-vertex:gemini-2.5-flash-lite"
  constraints:
    temperature: 0.1
    max_tokens: 8192

# No tools: block — the runtime ignores the key (it reads tools/*.yaml and
# builtins directly), and Badger no longer restricts the agent's tool list.
# Skills the agent has learned itself (via skill_learner) join this list in
# their own commits.
skills:
  - trace-decision
  - find-expert
  - onboard-to-project
  - recent-activity
  - diagnose-ticket-spike

runtime:
  max_turns: 40
  timeout: 300

compliance:
  risk_level: medium
  data_classification: confidential
  human_in_the_loop: false
  recordkeeping:
    audit_logging: true
    retention_days: 30

tags:
  - workplace-search
  - federated-search
  - enterprise-search
  - github
  - citations
